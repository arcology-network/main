settings:
  prometheus_listen_addr: ":19009"
  envs:
    generate_apc_handle: "block"
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: "./storage/urlfiles"
    cached: true
    transactional: true

actors:
  "-general_url-stateless_euresult_aggr_selector":
    general_url:
      generate_apc_handle: generation
      generate_url_update: "__env__"
      init_db: "__env__"
      dbpath: "__env__"
      object_cached: true
      generate_acct_root: "__env__"
    stateless_euresult_aggr_selector:
      output: "executed"

  storage.initializer:
    genesis_file: "/home/weizp/work/configs/genesis.json"
    dbpath: "./storage/urlfiles"

  storage.metrics: {}

  stateful_receipt_aggr_selector: {}

  storage:
    log_cache_size: 1000
    block_cache_size: 10
    tx_cache_size: 10
    chain_id: "__global__" 


  storage.tmblockstore:
    storage_tmblock_name: "tmblockstore"
    storage_tmblock_dir: "./storage/"

  storage.tmstatestore:
    tm_state_store_dir: "./storage/"

  storage.urlstore: {}

  storage.receiptstore:
    storage_receipt_path: "./storage/receiptfiles"
    cache_receipt_size: 100
    cache_exec_concurrency: 8

  storage.blockstore:
    storage_block_path: "./storage/blockfiles"
    cache_block_size: 100

  storage.statestore:
    storage_state_path: "./storage/statefile"

  storage.indexerstore:
    storage_index_path: "./storage/indexfiles"
    cache_index_size: 100
    storage_index_shards: 128
    storage_index_depts: 2

  storage.transactionalstore:
    root: "./storage/transactional/"
    optimization: true

msg_ops:
  - type: "rename"
    params:
      - "inclusive"
      - "conflictInclusive"