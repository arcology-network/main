settings:
  prometheus_listen_addr: ":19009"
  envs:
    generate_apc_handle: "block"
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: "../arcology/urlfiles"
    cached: true
    transactional: true

actors:
  "-general_url-stateless_euresult_aggr_selector":
    general_url:
      generate_apc_handle: "generation"
      generate_url_update: "__env__"
      init_db: "__env__"
      dbpath: "__env__"
      cached: "__env__"
      object_cached: true
      transactional: "__env__"
    stateless_euresult_aggr_selector:
      output: "executed"

  storage.initializer:
    genesis_file: "/home/weizp/work/configs/genesis.json"
    dbpath: "/home/weizp/monacos/urlfiles"

  storage.metrics: {}

  stateful_receipt_aggr_selector: {}

  storage:
    # remote_caches: "__global__"
    log_cache_size: 1000
    block_cache_size: 10
    tx_cache_size: 10
    # cache_svc_port: "6061"
    chain_id: "__global__" 
    # prometheus_host: "http://50.99.150.71:3030"
    # prometheus_fetch_frequency: 10
    # prometheus_fetch_ahead: 300
    # prometheus_fetch_step: "3"
    # coefficient: 130

  # storage.statesyncstore:
  #   slice_db_root: "./slices/"
  #   sync_point_root: "./sync_point/"
  #   sync_point_interval: 65536

  storage.schdstore:
    root: "./schdstore/"

  storage.tmblockstore:
    storage_tmblock_name: "tmblockstore"
    storage_tmblock_dir: "./"

  storage.tmstatestore:
    tm_state_store_dir: "./"

  storage.urlstore: {}

  storage.receiptstore:
    storage_receipt_path: "receiptfiles"
    cache_receipt_size: 100
    cache_exec_concurrency: 8

  storage.blockstore:
    storage_block_path: "blockfiles"
    cache_block_size: 100

  storage.statestore:
    storage_state_path: "statefile"

  storage.indexerstore:
    storage_index_path: "indexfiles"
    cache_index_size: 100
    storage_index_shards: 128
    storage_index_depts: 2

  storage.transactionalstore:
    root: "./transactional/"
    optimization: true

msg_ops:
  - type: "rename"
    params:
      - "inclusive"
      - "conflictInclusive"