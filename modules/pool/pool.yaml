settings:
  prometheus_listen_addr: ":19012"
  envs:
    generate_apc_handle: block
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: ../arcology/urlfiles
    cached: true
    transactional: true

actors:
  "-nonce_url-stateless_euresult_aggr_selector4pool":
    nonce_url:
      generate_apc_handle: "__env__"
      generate_url_update: false
      init_db: false
      dbpath: ../arcology/dbnonce
      cached: false
      object_cached: false
      transactional: false

    stateless_euresult_aggr_selector4pool:
      output: commitNonceUrl

  pool_aggr_selector:
    max_reap_size: 1000
    obsolete_time: 100
    close_check: true
    chain_id: "__global__"