settings:
  prometheus_listen_addr: ":19009"
  envs:
    generate_apc_handle: "block"
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: "./case_storage_store/urlfiles"
    cached: true
    transactional: true

actors:
  # storage.schdstore:
  #   root: "./case_storage_store/schdstore/"

  storage.tmblockstore:
    storage_tmblock_name: "tmblockstore"
    storage_tmblock_dir: "./case_storage_store/"

  storage.tmstatestore:
    tm_state_store_dir: "./case_storage_store/"

  storage.urlstore: {}

  storage.receiptstore:
    storage_receipt_path: "./case_storage_store/receiptfiles"
    cache_receipt_size: 100
    cache_exec_concurrency: 8

  storage.blockstore:
    storage_block_path: "./case_storage_store/blockfiles"
    cache_block_size: 100

  storage.statestore:
    storage_state_path: "./case_storage_store/statefile"

  storage.indexerstore:
    storage_index_path: "./case_storage_store/indexfiles"
    cache_index_size: 100
    storage_index_shards: 128
    storage_index_depts: 2

  storage.transactionalstore:
    root: "./case_storage_store/transactional/"
    optimization: true
