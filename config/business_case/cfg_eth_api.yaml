settings:
  prometheus_listen_addr: ":19010"
envs:
    generate_apc_handle: "block"
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: "./case_eth_api/urlfiles"
    cached: true
    transactional: true
actors:
  # stateful_receipt_aggr_selector: {}

  eth_api:
    filter_timeout_mins: 5
    key_file: "./genesis-accounts-100.txt"
    json_rpc_port: 7545
    auth_rpc_port: 8551
    jwt_file: "./jwt.txt"
    debug: false
    retry_time: 60
    protocol_version: 10002
    hash_rate: 998
    chain_id: "__global__"

  state_query: {}
  coinbase: {}

  storage:
    log_cache_size: 1000
    block_cache_size: 10
    tx_cache_size: 10
    chain_id: "__global__" 

  storage.schdstore:
    root: "./case_eth_api/schdstore/"

  storage.tmblockstore:
    storage_tmblock_name: "tmblockstore"
    storage_tmblock_dir: "./case_eth_api/"

  storage.tmstatestore:
    tm_state_store_dir: "./case_eth_api/"

  storage.urlstore: {}

  storage.receiptstore:
    storage_receipt_path: "./case_eth_api/receiptfiles"
    cache_receipt_size: 100
    cache_exec_concurrency: 8

  storage.blockstore:
    storage_block_path: "./case_eth_api/blockfiles"
    cache_block_size: 100

  storage.statestore:
    storage_state_path: "./case_eth_api/statefile"

  storage.indexerstore:
    storage_index_path: "./case_eth_api/indexfiles"
    cache_index_size: 100
    storage_index_shards: 128
    storage_index_depts: 2

  storage.transactionalstore:
    root: "./case_eth_api/transactional/"
    optimization: true