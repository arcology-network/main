settings:
  prometheus_listen_addr: ":19009"
  envs:
    generate_apc_handle: "block"
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: "./case_storage/urlfiles"
    cached: true
    transactional: true

actors:
  storage:
    # remote_caches: "__global__"
    log_cache_size: 1000
    block_cache_size: 10
    tx_cache_size: 10
    # cache_svc_port: "6061"
    chain_id: "__global__" 
    # prometheus_host: "http://50.99.150.71:3030"
    # prometheus_fetch_frequency: 10
    # prometheus_fetch_ahead: 300
    # prometheus_fetch_step: "3"
    # coefficient: 130

  # storage.schdstore:
  #   root: "./case_storage/schdstore/"

  storage.tmblockstore:
    storage_tmblock_name: "tmblockstore"
    storage_tmblock_dir: "./case_storage/"

  storage.tmstatestore:
    tm_state_store_dir: "./case_storage/"

  storage.urlstore: {}

  storage.receiptstore:
    storage_receipt_path: "./case_storage/receiptfiles"
    cache_receipt_size: 100
    cache_exec_concurrency: 8

  storage.blockstore:
    storage_block_path: "./case_storage/blockfiles"
    cache_block_size: 100

  storage.statestore:
    storage_state_path: "./case_storage/statefile"

  storage.indexerstore:
    storage_index_path: "./case_storage/indexfiles"
    cache_index_size: 100
    storage_index_shards: 128
    storage_index_depts: 2

  storage.transactionalstore:
    root: "./case_storage/transactional/"
    optimization: true