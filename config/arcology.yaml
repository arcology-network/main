settings:
  prometheus_listen_addr: ":19000"
  envs:
    generate_apc_handle: block
    generate_url_update: true
    generate_acct_root: true
    init_db: true
    dbpath: ../arcology/urlfiles
    cached: true
    transactional: true

actors:
  #arbitrator
  access_record_pre_processor: {}

  access_record_aggr_selector: {}

  arbitrator_rpc: {}

  #consensus
  consensus:
    max_tx_num: 1000
    rate: 1
    starter: 0
    storage_svc_name: storage
    zookeeper: "__global__"
    persistent_peers: "__global__"
    prometheus_listen_addr: ":19001"
    debug: false

  #coordinator
  coordinator.decision_maker: {}

  #core
  make_block: {}

  #eth-api 
  stateful_receipt_aggr_selector: {}   #receipt-hashing  #storage

  eth_api:
    filter_timeout_mins: 5
    key_file: ../configs/keys.txt
    json_rpc_port: 8545
    auth_rpc_port: 8551
    jwt_file: ../configs/jwt.txt
    debug: false
    retry_time: 60
    protocol_version: 10002
    hash_rate: 998
    chain_id: "__global__"

  coinbase: {}

  state_query: {}

  #exec
  "-general_url-stateless_euresult_aggr_selector":    #storage
    general_url:
      generate_apc_handle: generation
      generate_url_update: "__env__"
      init_db: "__env__"
      dbpath: "__env__"
      object_cached: true
      generate_acct_root: "__env__"
    stateless_euresult_aggr_selector:
      output: executed
  
  # exec_rpc: {}

  exec_debug:
    chain_id: "__global__"
    eus: 1

  executor:
    chain_id: "__global__"
    idx: 0

  #gateway
  local_tx_receiver: {}

  tx_dup_checker:
    wait_seconds: 60
    max_txs_num: 1000

  #pool
  "-nonce_url-stateless_euresult_aggr_selector4pool":
    nonce_url:
      generate_apc_handle: block
      generate_url_update: false
      init_db: false
      dbpath: ../arcology/dbnonce
      object_cached: false
      generate_acct_root: false
    stateless_euresult_aggr_selector4pool:
      output: commitNonceUrl
  
  pool_aggr_selector:
    max_reap_size: 20000
    obsolete_time: 100
    close_check: true
    chain_id: "__global__"

  #receipt-hashing
  receipt-hashing.calculator: {}

  receipt-hashing.metrics:
    maxRecords: 20000
    logfile: ./status.log

  #scheduler
  scheduler:
    batch_size: 500
    executors: "__global__"
    conflict_file: ../configs/conflictlist

  #storage
  storage.initializer:
    genesis_file: ../configs/genesis.json
    dbpath: "__env__"

  storage:
    remote_caches: "__global__"
    log_cache_size: 1000
    block_cache_size: 10
    tx_cache_size: 10
    cache_svc_port: "6061"
    chain_id: "__global__"
    prometheus_host: "http://50.99.150.71:3030"
    prometheus_fetch_frequency: 10
    prometheus_fetch_ahead: 300
    prometheus_fetch_step: "3"
    coefficient: 130

  storage.metrics: {}

  # storage.schdstore:
  #   root: ../arcology/schdstore/

  "storage.tmblockstore": 
    "storage_tmblock_name": "tmblockstore"
    "storage_tmblock_dir": "./"
  
  "storage.tmstatestore": 
    "tm_state_store_dir": "./"
  
  "storage.urlstore": {}

  "storage.receiptstore": 
    "storage_receipt_path": "receiptfiles"
    "cache_receipt_size": 100
    "cache_exec_concurrency": 8

  "storage.blockstore":
    "storage_block_path": "blockfiles"
    "cache_block_size": 100
  
  "storage.statestore": 
    "storage_state_path": "statefile"

  "storage.indexerstore":
    "storage_index_path": "indexfiles"
    "cache_index_size": 100
    "storage_index_shards": 128
    "storage_index_depts": 2

  "storage.transactionalstore": 
    "root": "./transactional/"
    "optimization": true

  # nonce_url_async:
  #   generate_acct_root: false

  # general_url_async:
  #   generate_acct_root: "__env__"


  #tpp
  tpp_rpc: {}

  tx_receiver: {}

  tx_unsigner:
    chain_id: "__global__"

msg_ops:
  - type: rename
    params:
      - inclusive
      - conflictInclusive